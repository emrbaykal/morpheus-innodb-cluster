---
# server_id is the node's cluster IP as a 32-bit number, so it is unique across subnets and
# sites (ClusterSet). A node that already has one keeps it: changing it on a member breaks recovery.
- name: Read the current server_id
  shell: awk -F '= *' '/^server_id/ {print $2}' {{ mysql_conf_dir }}/innodb-mysqld.cnf
  register: current_server_id
  changed_when: false
  failed_when: false

- name: Set server_id
  vars:
    octets: "{{ inventory_hostname.split('.') | map('int') | list }}"
  set_fact:
    mysql_server_id: "{{ current_server_id.stdout or octets[0] * 16777216 + octets[1] * 65536 + octets[2] * 256 + octets[3] }}"

- name: Write the InnoDB Cluster settings
  copy:
    dest: "{{ mysql_conf_dir }}/innodb-mysqld.cnf"
    content: |
      [mysqld]
      bind-address = 0.0.0.0
      max_connections = 451
      max_allowed_packet = 256M
      character-set-server = utf8mb4
      collation-server = utf8mb4_general_ci
      default-time-zone = '+00:00'
      innodb_buffer_pool_size = {{ (ansible_memtotal_mb * 0.8 / 1024) | int }}G
      innodb_use_fdatasync = ON
      innodb_numa_interleave = ON
      sql_generate_invisible_primary_key = ON
      binlog_expire_logs_seconds = 604800
      binlog_expire_logs_auto_purge = ON
      gtid_mode = ON
      enforce_gtid_consistency = ON
      server_id = {{ mysql_server_id }}

      [mysqldump]
      set-gtid-purged = OFF
    mode: "0644"
  notify: Restart mysql

- name: Restart MySQL with the new settings
  meta: flush_handlers

# Skipped when the user exists: secondaries are read-only once they joined the cluster.
# sql_log_bin=0 keeps the account out of the GTID set, so no node has errant transactions.
- name: Create the cluster admin user
  shell: >
    mysql -u root -N -e "SELECT user FROM mysql.user WHERE user = '{{ innodb_admin_user }}' AND host = '%'" | grep -q . ||
    { mysql -u root -e "SET SESSION sql_log_bin = 0;
    CREATE USER '{{ innodb_admin_user }}'@'%' IDENTIFIED BY '{{ innodb_admin_password }}';
    GRANT ALL PRIVILEGES ON *.* TO '{{ innodb_admin_user }}'@'%' WITH GRANT OPTION" && echo changed; }
  environment:
    MYSQL_PWD: "{{ mysql_root_password }}"
  register: admin_user
  changed_when: "'changed' in admin_user.stdout"
  no_log: true
