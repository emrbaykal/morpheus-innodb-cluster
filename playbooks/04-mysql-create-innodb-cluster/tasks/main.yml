---
- name: Wait for MySQL on all nodes
  wait_for:
    host: "{{ item }}"
    port: 3306
    timeout: 300
  loop: "{{ groups['mysql_nodes'] }}"

- name: Create the cluster
  block:
    - name: Write the MySQL Shell script
      template:
        src: create_cluster.js.j2
        dest: /root/create_cluster.js
        mode: "0600"

    - name: Configure the instances, create the cluster, add the secondaries, set up the router user
      command: mysqlsh --no-wizard --js --file=/root/create_cluster.js
      register: mysqlsh
      changed_when: "'created' in mysqlsh.stdout or 'added' in mysqlsh.stdout"

    - name: Show the cluster status
      debug:
        var: mysqlsh.stdout_lines
  always:
    - name: Remove the MySQL Shell script
      file:
        path: /root/create_cluster.js
        state: absent
