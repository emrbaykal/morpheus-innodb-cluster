---
# MySQL Server comes from Red Hat AppStream (supported by Red Hat).
# Where the series is a module stream (8.4 on RHEL 9) the
# stream is enabled; otherwise the module is reset so the plain packages show.
- name: Select the MySQL {{ mysql_version }} AppStream stream
  shell: |
    streams=$(dnf -q module list mysql 2>/dev/null | awk '$1 == "mysql" {print $2}')
    enabled=$(dnf -q module list --enabled mysql 2>/dev/null | awk '$1 == "mysql" {print $2}')
    if echo "$streams" | grep -qx '{{ mysql_version }}'; then
      [ "$enabled" = '{{ mysql_version }}' ] && exit 0
      dnf -y module reset mysql && dnf -y module enable mysql:{{ mysql_version }} && echo changed
    elif [ -n "$enabled" ]; then
      dnf -y module reset mysql && echo changed
    fi
  register: mysql_stream
  changed_when: "'changed' in mysql_stream.stdout"

- name: Install MySQL {{ mysql_version_full }}
  dnf:
    name:
      - mysql-server-{{ mysql_version_full }}
      - mysql-{{ mysql_version_full }}
      - python3-dnf-plugin-versionlock
      - numactl

# MySQL Shell is not in AppStream; it comes from Oracle's tools repository.
- name: Add the MySQL Shell repository
  yum_repository:
    name: mysql-tools
    description: MySQL Shell {{ mysql_version }}
    baseurl: "https://repo.mysql.com/yum/{{ 'mysql-tools-community' if mysql_version == '8.0' else 'mysql-tools-8.4-community' }}/el/$releasever/$basearch/"
    gpgkey:
      - https://repo.mysql.com/RPM-GPG-KEY-mysql-2025
      - https://repo.mysql.com/RPM-GPG-KEY-mysql-2023

- name: Install MySQL Shell
  dnf:
    name: mysql-shell

- name: Lock the MySQL package versions
  shell: >
    dnf versionlock list | grep -q '^mysql-server-' ||
    { dnf versionlock add mysql-server mysql mysql-shell && echo changed; }
  register: versionlock
  changed_when: "'changed' in versionlock.stdout"
