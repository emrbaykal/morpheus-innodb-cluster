---
# Oracle's APT index only carries the newest build of a series, so the chosen
# version is downloaded from the repository pool and installed as local files.
- name: Install numactl
  apt:
    name: numactl
    update_cache: true
    lock_timeout: 300

- name: Check the installed MySQL version
  command: dpkg-query -W -f=${Version} mysql-community-server
  register: installed_mysql
  changed_when: false
  failed_when: false

- name: Download and install MySQL {{ mysql_version_full }}
  when: not installed_mysql.stdout.startswith(mysql_version_full + '-')
  vars:
    pool: "https://repo.mysql.com/apt/ubuntu/pool/{{ 'mysql-8.0' if mysql_version == '8.0' else 'mysql-8.4-lts' }}/m"
    suffix: "-1ubuntu{{ ansible_distribution_version }}_amd64.deb"
    download_dir: /var/tmp/mysql-{{ mysql_version_full }}
  block:
    - name: Create the download directory
      file:
        path: "{{ download_dir }}"
        state: directory
        mode: "0755"

    - name: Download the MySQL Server packages
      get_url:
        url: "{{ pool }}/mysql-community/{{ item }}_{{ mysql_version_full }}{{ suffix }}"
        dest: "{{ download_dir }}/"
        mode: "0644"
      loop: "{{ mysql_server_packages }}"

    - name: Download MySQL Shell {{ mysql_shell_version }}
      get_url:
        url: "{{ pool }}/mysql-shell/mysql-shell_{{ mysql_shell_version }}{{ suffix }}"
        dest: "{{ download_dir }}/"
        mode: "0644"

    - name: Install the downloaded packages
      shell: apt-get install -y -o DPkg::Lock::Timeout=300 {{ download_dir }}/*.deb
      environment:
        DEBIAN_FRONTEND: noninteractive

- name: Hold the MySQL packages
  dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: "{{ mysql_server_packages + ['mysql-shell'] }}"
