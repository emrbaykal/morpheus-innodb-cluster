---
- name: Restart sshd
  service:
    name: "{{ 'ssh' if ansible_os_family == 'Debian' else 'sshd' }}"
    state: restarted

- name: Restart chronyd
  service:
    name: chronyd
    state: restarted
    enabled: true

- name: Restart timesyncd
  service:
    name: systemd-timesyncd
    state: restarted
    enabled: true

- name: Update grub
  command: update-grub

- name: Apply kernel parameters
  command: sysctl --system
